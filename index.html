<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Panel Log Pro — Alarm Operations Management</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0d1013">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="panel-cloud.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0e1416;
    --panel-bg:#161d21;
    --panel-bg-2:#1c262b;
    --row-alt:#1a2226;
    --border:#2a363c;
    --border-soft:#212b30;
    --text:#e8edef;
    --text-dim:#889aa3;
    --text-faint:#57676f;
    --accent:#4caf7d;
    --accent-dim:#1c3f30;
    --warn:#e3a63e;
    --warn-dim:#4a3719;
    --danger:#e4574b;
    --danger-dim:#4a201c;
    --focus:#3ec8d6;
    --focus-dim:#153a3f;
    --bevel: inset 0 1px 0 rgba(255,255,255,.04);
    --sans: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --mono: "IBM Plex Mono", "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:var(--sans);
    font-size:14px;
    line-height:1.45;
    -webkit-tap-highlight-color:transparent;
    -webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale;
  }
  ::selection{background:var(--focus-dim); color:var(--text);}
  button{font-family:inherit; font-size:inherit; color:inherit;}
  input,select,textarea{font-family:inherit; font-size:inherit; color:var(--text); background:var(--panel-bg-2); border:1px solid var(--border); border-radius:6px; padding:6px 8px;}
  input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--focus); outline-offset:1px;}
  textarea{resize:vertical; font-family:var(--sans);}
  button{cursor:pointer; background:var(--panel-bg-2); border:1px solid var(--border); border-radius:6px; padding:6px 10px; transition:background .15s ease, border-color .15s ease, color .15s ease;}
  button:hover{border-color:var(--text-faint);}
  input,select,textarea{transition:border-color .15s ease;}
  button.primary{background:var(--focus-dim); border-color:var(--focus); color:#eafbfd;}
  button.primary:hover{background:#1c4a50;}
  button.danger{background:transparent; border-color:var(--danger-dim); color:var(--danger);}
  button.danger:hover{background:var(--danger-dim);}
  button.ghost{background:transparent; border-color:transparent; color:var(--text-dim);}
  button.ghost:hover{color:var(--text); border-color:var(--border);}
  button.icon{padding:6px 9px; line-height:1;}
  a{color:var(--focus);}

  /* header */
  #topbar{
    background:#0d1013;
    border-bottom:1px solid var(--border);
    box-shadow:0 2px 6px rgba(0,0,0,.25);
    padding:10px 14px;
    display:flex; align-items:center; gap:10px; flex-wrap:wrap;
    position:relative; z-index:5;
  }
  #brand{display:flex; flex-direction:column; margin-right:2px;}
  #brand .name{font-family:var(--mono); font-weight:600; letter-spacing:.3px; color:var(--focus); font-size:15px;}
  #brand .status{font-family:var(--mono); color:var(--text-faint); font-size:11px;}

  .navtabs{display:flex; gap:4px; flex-wrap:wrap;}
  .navtab{padding:6px 12px; border-radius:5px; background:transparent; border:1px solid transparent; border-bottom:2px solid transparent; color:var(--text-dim); font-size:13px;}
  .navtab:hover{color:var(--text);}
  .navtab.active{background:var(--panel-bg-2); border-color:var(--border); border-bottom-color:var(--focus); color:var(--text); font-weight:500;}

  #search{flex:1 1 160px; min-width:120px;}
  #topbar-actions{display:flex; gap:6px; flex-wrap:wrap; margin-left:auto;}
  #file-import{display:none;}

  /* layout */
  #app{height:calc(100% - 49px); min-height:0; position:relative;}
  .view-panel{display:none; height:100%; min-height:0;}
  #view-dashboard, #view-reports{overflow-y:auto; padding:20px 24px 60px;}

  .list-pane{
    width:300px; flex:0 0 300px;
    border-right:1px solid var(--border);
    overflow-y:auto;
    background:var(--panel-bg);
  }
  .detail-pane{flex:1 1 auto; overflow-y:auto; padding:20px 24px 60px;}

  .site-item{
    display:block; width:100%; text-align:left;
    padding:12px 14px; border:0; border-bottom:1px solid var(--border-soft);
    background:transparent; border-radius:0;
  }
  .site-item:hover{background:var(--panel-bg-2);}
  .site-item.selected{background:var(--panel-bg-2); box-shadow:inset 3px 0 0 var(--focus);}
  .site-item .sname{font-weight:600; color:var(--text); display:block;}
  .site-item .smeta{font-family:var(--mono); font-size:11.5px; color:var(--text-dim); margin-top:3px; display:block;}
  .site-item .saddr{font-size:12px; color:var(--text-faint); margin-top:2px; display:block;}

  .filter-row{display:flex; gap:6px; padding:10px 10px 8px; border-bottom:1px solid var(--border-soft); flex-wrap:wrap;}
  .filter-chip{padding:4px 10px; font-size:11.5px; border-radius:12px; background:transparent; border:1px solid var(--border); color:var(--text-dim);}
  .filter-chip.active{background:var(--focus-dim); border-color:var(--focus); color:#eafbfd;}
  .filter-chip.danger-active{background:var(--danger-dim); border-color:var(--danger); color:#ffd4d0;}

  #empty-state{padding:60px 24px; color:var(--text-dim); max-width:420px;}
  #empty-state h2{color:var(--text); font-size:17px; margin-bottom:8px;}
  #empty-list-msg{padding:24px 16px; color:var(--text-faint); font-size:13px;}

  .backbtn{display:none;}

  h1.site-title{font-size:21px; font-weight:600; letter-spacing:-.01em; margin:0 0 2px;}
  .site-sub{color:var(--text-dim); font-size:12.5px; margin-bottom:18px; font-family:var(--mono);}

  .field-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px 14px; margin-bottom:8px;}
  .field{display:flex; flex-direction:column; gap:4px;}
  .field label{font-size:11px; color:var(--text-dim); letter-spacing:.2px;}
  .field input, .field select, .field textarea{width:100%;}
  .field.span2{grid-column:1 / -1;}

  section.block{margin-top:26px; padding-top:18px; border-top:1px solid var(--border-soft);}
  .block-head{display:flex; align-items:baseline; justify-content:space-between; margin-bottom:10px; gap:8px; flex-wrap:wrap;}
  .block-head h2{font-size:13px; text-transform:none; color:var(--text); margin:0; font-weight:600;}
  .block-head .count{color:var(--text-faint); font-size:12px; font-family:var(--mono); margin-left:6px;}

  table.rows{width:100%; border-collapse:collapse; font-size:13px;}
  table.rows th{
    text-align:left; font-weight:500; color:var(--text-faint); font-size:11px;
    padding:0 8px 6px; border-bottom:1px solid var(--border);
  }
  table.rows td{padding:5px 8px; vertical-align:top; border-bottom:1px solid var(--border-soft);}
  table.rows tr:last-child td{border-bottom:none;}
  table.rows input, table.rows select{width:100%; padding:5px 6px;}
  table.rows td.num{width:56px;}
  table.rows td.rm{width:60px; text-align:center; white-space:nowrap;}
  table.rows td.rm button{padding:5px 7px;}
  table.rows input.zonenum{font-family:var(--mono); text-align:center;}

  .status-pill{display:inline-flex; align-items:center; gap:5px; padding:2px 8px 2px 6px; border-radius:10px; font-size:11px; font-family:var(--mono);}
  .status-pill::before{content:""; width:6px; height:6px; border-radius:50%; background:currentColor; flex:0 0 auto;}
  .status-active{background:var(--accent-dim); color:#b9e8cf;}
  .status-inactive{background:#242e33; color:var(--text-faint);}
  .status-bypassed{background:var(--warn-dim); color:#f3d6a0;}
  .status-fault{background:var(--danger-dim); color:#f5c9c4;}

  .empty-rows{color:var(--text-faint); font-size:12.5px; padding:10px 0;}

  .site-footer{margin-top:34px; padding-top:16px; border-top:1px solid var(--border-soft); display:flex; justify-content:space-between; gap:8px; flex-wrap:wrap;}

  .cust-link-card{background:var(--panel-bg-2); border:1px solid var(--border); border-radius:10px; padding:12px 14px; margin-top:4px; font-size:12.5px; color:var(--text-dim); box-shadow:var(--bevel);}
  .cust-link-card .cname{color:var(--text); font-weight:600; font-size:13.5px; display:block; margin-bottom:4px;}
  .cust-link-card .crow{margin-top:2px;}
  .cust-link-empty{color:var(--text-faint); font-size:12.5px; padding:6px 0;}
  .link-actions{display:flex; gap:8px; margin-top:10px; flex-wrap:wrap;}

  .link-row{display:block; width:100%; text-align:left; padding:9px 12px; border:0; border-bottom:1px solid var(--border-soft); background:transparent; border-radius:0; font-size:13px;}
  .link-row:hover{background:var(--panel-bg-2);}
  .link-row .lr-title{font-weight:600; color:var(--text); display:block;}
  .link-row .lr-sub{font-family:var(--mono); font-size:11px; color:var(--text-dim); margin-top:2px; display:block;}

  /* dashboard */
  .stat-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:12px; margin-bottom:30px;}
  .stat-card{background:var(--panel-bg); border:1px solid var(--border); border-radius:10px; padding:14px 16px; box-shadow:var(--bevel);}
  .stat-card .num{font-size:26px; font-weight:700; color:var(--text); font-family:var(--mono); line-height:1;}
  .stat-card .label{font-size:12px; color:var(--text-dim); margin-top:6px;}
  .stat-card.warn .num{color:var(--warn);}
  .stat-card.danger .num{color:var(--danger);}
  .dash-section{margin-bottom:30px;}
  .dash-section h2{font-size:13px; font-weight:600; color:var(--text); margin:0 0 10px;}
  .dash-list{border:1px solid var(--border-soft); border-radius:8px; overflow:hidden; box-shadow:var(--bevel);}

  .bar-row{display:flex; align-items:center; gap:10px; margin-bottom:9px; font-size:12.5px;}
  .bar-row .bar-label{width:130px; flex:0 0 130px; color:var(--text-dim); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .bar-track{flex:1 1 auto; height:9px; background:var(--panel-bg-2); border-radius:5px; overflow:hidden;}
  .bar-fill{height:100%; border-radius:5px; transition:width .3s ease;}
  .bar-count{width:34px; text-align:right; color:var(--text-faint); font-family:var(--mono); font-size:11.5px;}

  .sort-select{font-size:11.5px; padding:4px 6px; margin-left:auto;}
  .list-toolbar{display:flex; align-items:center; gap:8px; padding:8px 10px 0;}

  .overdue-flag{color:var(--warn);}
  .quick-link{color:var(--focus); text-decoration:none;}
  .quick-link:hover{text-decoration:underline;}
  .zonenum-dupe{outline:1.5px solid var(--danger) !important;}

  /* reports */
  .report-toolbar{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px;}
  .report-controls{display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin:14px 0 4px;}
  .report-search{flex:1 1 220px; min-width:160px; padding:7px 10px;}
  .report-count{color:var(--text-faint); font-size:11.5px; font-family:var(--mono); margin-left:2px;}
  .report-preview{overflow-x:auto;}
  .report-preview table{min-width:540px;}
  .site-pick-list{border:1px solid var(--border-soft); border-radius:8px; max-height:260px; overflow-y:auto; margin-top:10px; box-shadow:var(--bevel);}
  .report-preview{background:var(--panel-bg); border:1px solid var(--border); border-radius:10px; padding:18px 20px; margin-top:14px; box-shadow:var(--bevel);}
  .report-preview h1{font-size:17px; margin:0 0 2px;}
  .report-preview h2{font-size:12.5px; margin:18px 0 8px; color:var(--text); text-transform:none;}
  .report-preview p{margin:2px 0; font-size:12.5px; color:var(--text-dim);}
  .report-preview table{width:100%; border-collapse:collapse; font-size:12px; margin-bottom:4px;}
  .report-preview th,.report-preview td{border:1px solid var(--border-soft); padding:4px 6px; text-align:left;}
  .report-preview th{color:var(--text-faint); font-weight:500;}
  .report-empty{color:var(--text-faint); font-size:13px; padding:20px 0;}

  #print-area{display:none;}

  #toast{
    position:fixed; bottom:18px; left:50%; transform:translateX(-50%) translateY(20px);
    background:var(--panel-bg-2); border:1px solid var(--border); color:var(--text);
    padding:9px 16px; border-radius:6px; font-size:13px; opacity:0; pointer-events:none;
    transition:opacity .18s ease, transform .18s ease; z-index:50;
  }
  #toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

  .modal-overlay{position:fixed; inset:0; background:rgba(6,8,10,.6); display:flex; align-items:center; justify-content:center; z-index:60; padding:20px; overflow-y:auto;}
  .modal{background:var(--panel-bg); border:1px solid var(--border); border-radius:10px; padding:20px; max-width:360px; width:100%; box-shadow:var(--bevel), 0 12px 32px rgba(0,0,0,.35); margin:auto;}
  .modal h3{margin:0 0 8px; font-size:15px;}
  .modal p{color:var(--text-dim); font-size:13px; margin:0 0 16px;}
  .modal .modal-actions{display:flex; gap:8px; justify-content:flex-end; flex-wrap:wrap; margin-top:16px;}
  .modal.form-modal{max-width:600px; text-align:left;}
  .modal.form-modal .field-grid{margin-top:4px;}
  .req{color:var(--danger);}
  .field-error{color:var(--danger); font-size:11px; margin-top:2px; min-height:13px;}
  .field.invalid input, .field.invalid select, .field.invalid textarea{border-color:var(--danger);}

  .record-summary{border:1px solid var(--border-soft); border-radius:8px; margin:4px 0 12px; overflow:hidden;}
  .rs-row{display:flex; gap:10px; padding:8px 12px; border-bottom:1px solid var(--border-soft); font-size:13px;}
  .rs-row:last-child{border-bottom:0;}
  .rs-k{flex:0 0 130px; color:var(--text-dim); font-size:11.5px; padding-top:1px;}
  .rs-v{flex:1 1 auto; color:var(--text); white-space:pre-wrap;}

  @media (max-width: 760px){
    #search{order:3; flex:1 1 100%;}
    .view-panel.split-active{position:relative; overflow:hidden;}
    .list-pane{
      position:absolute; inset:0; width:100%; flex:none; border-right:none;
      transition:transform .18s ease;
    }
    .detail-pane{
      position:absolute; inset:0; padding:16px 16px 60px;
      transform:translateX(100%); transition:transform .18s ease; background:var(--bg);
    }
    body.view-detail .list-pane{transform:translateX(-100%);}
    body.view-detail .detail-pane{transform:translateX(0);}
    .backbtn{display:inline-flex; margin-bottom:14px;}
    .field-grid{grid-template-columns:1fr;}
    table.rows{display:block; overflow-x:auto; white-space:nowrap;}
  }

  @media (max-width: 420px){
    #brand .name{font-size:13px;}
    #brand .status{font-size:10px;}
    .navtabs{gap:2px;}
    .navtab{padding:6px 9px; font-size:12px;}
    #topbar-actions button{padding:6px 8px; font-size:12.5px;}
    .stat-grid{grid-template-columns:repeat(2,1fr);}
    .report-search{flex-basis:100%;}
  }

  @media print{
    body > *:not(#print-area){display:none !important;}
    body{background:#fff; color:#111;}
    #print-area{display:block !important; position:static; padding:0;}
    #print-area h1{font-size:18px; margin:0 0 4px;}
    #print-area h2{font-size:13px; margin:16px 0 6px; border-bottom:1px solid #999; padding-bottom:3px; color:#111;}
    #print-area p{margin:2px 0; font-size:12px; color:#333;}
    #print-area table{width:100%; border-collapse:collapse; font-size:11px; margin-bottom:6px;}
    #print-area th,#print-area td{border:1px solid #999; padding:4px 6px; text-align:left; color:#111;}
  }

  /* ---------- Alarm Operations upgrade ---------- */
  .ops-page{padding:20px 24px 70px;overflow:auto;height:100%;box-sizing:border-box}
  .ops-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:18px;flex-wrap:wrap}
  .ops-head h1{margin:0;font-size:22px}.ops-head p{margin:4px 0 0;color:var(--text-dim);font-size:12px}
  .ops-actions{display:flex;gap:7px;flex-wrap:wrap}.ops-actions button{white-space:nowrap}
  .kpi-grid{display:grid;grid-template-columns:repeat(6,minmax(130px,1fr));gap:10px;margin-bottom:16px}
  .kpi{background:linear-gradient(145deg,var(--panel-bg-2),var(--panel-bg));border:1px solid var(--border);border-radius:8px;padding:13px;box-shadow:var(--bevel)}
  .kpi .label{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--text-faint)}.kpi .num{font:700 23px var(--mono);margin-top:7px;color:var(--text)}.kpi .hint{font-size:10px;color:var(--text-dim);margin-top:3px}
  .ops-grid{display:grid;grid-template-columns:1.35fr 1fr;gap:14px}.ops-card{background:var(--panel-bg);border:1px solid var(--border);border-radius:8px;overflow:hidden}.ops-card h2{font-size:13px;margin:0;padding:12px 14px;border-bottom:1px solid var(--border);font-weight:600}.ops-card-body{padding:12px 14px}
  .ops-table{width:100%;border-collapse:collapse;font-size:12px}.ops-table th{font:600 10px var(--mono);color:var(--text-faint);text-align:left;text-transform:uppercase;letter-spacing:.04em;padding:8px;border-bottom:1px solid var(--border)}.ops-table td{padding:9px 8px;border-bottom:1px solid var(--border-soft);vertical-align:middle}.ops-table tr:hover{background:var(--panel-bg-2)}
  .badge{display:inline-flex;align-items:center;padding:3px 7px;border:1px solid var(--border);border-radius:10px;font:600 10px var(--mono);white-space:nowrap}.badge.green{border-color:#2f7455;color:#7de0ad;background:#153025}.badge.red{border-color:#7d3d37;color:#ff9e95;background:#321b19}.badge.amber{border-color:#7a5a2a;color:#eacb82;background:#302713}.badge.blue{border-color:#2c6570;color:#8ee8f0;background:#153034}.badge.gray{color:var(--text-dim)}
  .ops-toolbar{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-bottom:12px}.ops-toolbar input,.ops-toolbar select{min-width:140px}.ops-toolbar .grow{flex:1 1 220px}
  .ops-empty{padding:30px;text-align:center;color:var(--text-faint);border:1px dashed var(--border);border-radius:7px}.row-actions{display:flex;gap:4px;justify-content:flex-end}.row-actions button{padding:4px 7px;font-size:10px}
  .statline{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--border-soft);font-size:12px}.statline:last-child{border-bottom:0}.statline b{font-family:var(--mono)}
  .ops-mobile-note{display:none}
  @media(max-width:1000px){.kpi-grid{grid-template-columns:repeat(3,1fr)}.ops-grid{grid-template-columns:1fr}}
  @media(max-width:680px){.kpi-grid{grid-template-columns:repeat(2,1fr)}.ops-page{padding:14px 12px 50px}.ops-table{min-width:760px}.ops-card-body.table-wrap{overflow:auto}.ops-mobile-note{display:block;color:var(--text-faint);font-size:10px;margin-bottom:8px}.navtabs{overflow-x:auto;flex-wrap:nowrap}.navtab{white-space:nowrap}.ops-head h1{font-size:19px}}

/* =========================================================
   PANEL LOG PRO — PROFESSIONAL UI LAYER
   ========================================================= */
:root{
  --bg:#081016;
  --panel-bg:#0f1a21;
  --panel-bg-2:#14232b;
  --row-alt:#111f26;
  --border:#263944;
  --border-soft:#1c2b33;
  --text:#edf5f7;
  --text-dim:#91a5ae;
  --text-faint:#5f747e;
  --accent:#52d49a;
  --accent-dim:#123b2d;
  --warn:#e9b65b;
  --warn-dim:#43351b;
  --danger:#f06a61;
  --danger-dim:#48211f;
  --focus:#55c8d8;
  --focus-dim:#11363e;
  --shadow:0 18px 50px rgba(0,0,0,.24);
  --shadow-soft:0 8px 24px rgba(0,0,0,.18);
}
html{scroll-behavior:smooth}
body{
  background:
    radial-gradient(900px 500px at 8% -10%,rgba(82,212,154,.08),transparent 60%),
    radial-gradient(800px 500px at 100% 0%,rgba(85,200,216,.07),transparent 55%),
    var(--bg);
}
#topbar{
  min-height:64px;
  padding:10px 18px;
  background:rgba(7,14,19,.90);
  border-bottom:1px solid rgba(93,130,143,.22);
  box-shadow:0 8px 30px rgba(0,0,0,.18);
  backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);
}
#brand{min-width:150px}
#brand .name{
  font-size:16px;
  letter-spacing:.12em;
  color:#dffaf1;
  text-shadow:0 0 18px rgba(82,212,154,.18);
}
#brand .status{margin-top:2px}
.navtabs{gap:5px}
.navtab{
  padding:8px 11px;
  border-radius:8px;
  transition:all .18s ease;
}
.navtab.active{
  background:linear-gradient(180deg,rgba(85,200,216,.13),rgba(85,200,216,.05));

 const root=document.documentElement;

 function apply(t){root.setAttribute('data-theme',t);localStorage.setItem(key,t);const b=document.getElementById('btn-theme');if(b)b.textContent=t==='light'?'☾ Dark':'☀ Light';}
 const saved=localStorage.getItem(key)||'dark'; apply(saved);

<script>
(async function(){
  "use strict";

  var STORAGE_KEY = "panelLogData.v2";
  var LEGACY_STORAGE_KEY = "panelLogData.v1";
  var EOL_OPTIONS = ["None (direct)", "Single EOL (SEOL)", "Double EOL (DEOL)", "Triple EOL (TEOL)"];
  var STATUS_OPTIONS = ["Active", "Inactive", "Bypassed", "Fault"];
  var PANEL_TYPE_OPTIONS = ["Wired", "Wireless", "Hybrid"];
  var DEVICE_SUGGESTIONS = ["PIR", "Door Contact", "Glass Break", "Curtain PIR", "Dual-Tech PIR", "Shock Sensor", "Smoke Detector", "Panic Button", "Reed Switch", "Vibration Sensor"];
  var PANEL_MODELS = {
    "Satel Integra": ["32", "64", "64+", "64 plus", "128", "128+", "256", "256+"],
    "Avs": ["Xtreme 640"]
  };
  var PANEL_BRAND_OPTIONS = Object.keys(PANEL_MODELS);
  var IP_MODULE_OPTIONS = ["Satel", "Snappy", "Eweb"];
  var CONTRACT_TYPE_OPTIONS = ["None", "AMC", "Per-visit", "Warranty"];
  var SERVICE_FREQ_OPTIONS = ["On-demand", "Monthly", "Quarterly", "Biannual", "Annual"];
  var SERVICE_FREQ_DAYS = {"Monthly":35, "Quarterly":100, "Biannual":200, "Annual":400};
  var DEFAULT_OVERDUE_DAYS = 90;
  var CONTACT_ROLE_SUGGESTIONS = ["Facility Manager", "Owner", "Security In-charge", "IT Admin", "Technician", "Receptionist"];

  var VIEWS = ["dashboard", "sites", "customers", "reports"];

  var state = {
    sites: [],
    customers: [],
    selectedSiteId: null,
    selectedCustomerId: null,
    selectedBranchId: null,
    searchQuery: "",
    view: "dashboard",
    siteFilter: "all",
    siteSort: "name",
    customerSort: "name",
    reportTab: "attention",
    reportSiteId: null,
    reportSearch: "",
    attentionFilter: "all",
    attentionSort: "severity",
    visitsFilter: "all",
    visitsSort: "date-desc",
    reportSiteSearch: ""
  };

  function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }

  // ---------- persistence + migration ----------

  function loadData(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      if(raw){
        var parsed = JSON.parse(raw);
        if(parsed && Array.isArray(parsed.sites)) state.sites = parsed.sites;
        if(parsed && Array.isArray(parsed.customers)) state.customers = parsed.customers;
      } else {
        var legacy = localStorage.getItem(LEGACY_STORAGE_KEY);
        if(legacy){
          var lp = JSON.parse(legacy);
          if(lp && Array.isArray(lp.sites)) state.sites = lp.sites;
        }
      }
    }catch(e){ console.error("Load failed", e); }

    // ensure every site has the newer fields + migrate embedded customer objects
    state.sites.forEach(function(s){
      if(!Array.isArray(s.expanders)) s.expanders = [];
      if(!Array.isArray(s.keypads)) s.keypads = [];
      if(!Array.isArray(s.zones)) s.zones = [];
      if(!Array.isArray(s.visits)) s.visits = [];
      if(typeof s.customerId !== "string") s.customerId = "";

      if(!s.customerId && s.customer && typeof s.customer === "object"){
        var c = s.customer;
        var hasData = (c.name || c.tl || c.acc || c.contact || c.phone || c.email);
        if(hasData){
          var nc = newCustomer();
          nc.name = c.name || "";
          nc.tl = c.tl || "";
          nc.acc = c.acc || "";
          if(c.contact || c.phone || c.email){
            nc.contacts.push({id: uid(), name: c.contact || "", role: "", phone: c.phone || "", email: c.email || ""});
          }
          state.customers.push(nc);
          s.customerId = nc.id;
        }
      }
      delete s.customer;
    });
    state.customers.forEach(function(c){
      if(!Array.isArray(c.branches)) c.branches = [];
      // Legacy TL/Acc values are migrated into a branch so each site can carry its own account identity.
      if(c.branches.length === 0 && (c.tl || c.acc || sitesForCustomer(c.id).length)){
        var lb = {id:uid(), name:"Main", code:"", tl:c.tl||"", acc:c.acc||"", address:"", area:"", city:"", contact:"", phone:"", status:"Active", notes:""};
        c.branches.push(lb);
        sitesForCustomer(c.id).forEach(function(site){ if(!site.branchId) site.branchId = lb.id; });
      }
      if(typeof c.tl !== "string") c.tl = "";
      if(typeof c.acc !== "string") c.acc = "";
      if(!Array.isArray(c.contacts)) c.contacts = [];
      if(typeof c.notes !== "string") c.notes = "";
      if(typeof c.contractType !== "string") c.contractType = "";
      if(typeof c.contractStart !== "string") c.contractStart = "";
      if(typeof c.contractRenewal !== "string") c.contractRenewal = "";
      if(typeof c.serviceFrequency !== "string") c.serviceFrequency = "";
    });
  }

  function saveData(){
    try{
      localStorage.setItem(STORAGE_KEY, JSON.stringify({sites: state.sites, customers: state.customers}));
      if(window.PanelCloud) window.PanelCloud.scheduleSave();
    }catch(e){
      console.error("Save failed", e);
      showToast("Couldn't save — storage may be full");
    }
  }

  function newSite(){
    return {
      id: uid(),
      name: "New site",
      address: "",
      client: "",
      customerId: "",
      branchId: "",
      panelBrand: "",
      panelModel: "",
      ipModule: "",
      panelType: "Wired",
      lastVisited: "",
      notes: "",
      expanders: [],
      keypads: [],
      zones: [],
      visits: []
    };
  }

  function newCustomer(){
    return {
      id: uid(),
      name: "New customer",
      tl: "",
      acc: "",
      notes: "",
      contractType: "",
      contractStart: "",
      contractRenewal: "",
      serviceFrequency: "",
      contacts: [],
      branches: []
    };
  }

  function findSite(id){
    for(var i=0;i<state.sites.length;i++) if(state.sites[i].id===id) return state.sites[i];
    return null;
  }
  function findCustomer(id){
    for(var i=0;i<state.customers.length;i++) if(state.customers[i].id===id) return state.customers[i];
    return null;
  }
  function sitesForCustomer(id){
    return state.sites.filter(function(s){ return s.customerId === id; });
  }

  function branchesForCustomer(id){
    var c = findCustomer(id);
    return c && Array.isArray(c.branches) ? c.branches : [];
  }
  function findBranch(customerId, branchId){
    return branchesForCustomer(customerId).filter(function(b){ return b.id === branchId; })[0] || null;
  }
  function branchName(site){
    var b = site && site.customerId ? findBranch(site.customerId, site.branchId) : null;
    return b ? b.name : "No branch";
  }

  function esc(s){
    return String(s==null?"":s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }

  function optionList(options, current){
    return options.map(function(o){
      // Support both legacy "value|label" options and modern {value,label} objects.
      // The stored ID remains the option value, while the user sees only the friendly label.
      var value = "", label = "";
      if(o && typeof o === "object"){
        value = o.value == null ? "" : String(o.value);
        label = o.label == null ? value : String(o.label);
      } else {
        var raw = String(o == null ? "" : o);
        var pipe = raw.indexOf("|");
        if(pipe > -1){ value = raw.slice(0, pipe); label = raw.slice(pipe + 1); }
        else { value = raw; label = raw; }
      }
      return '<option value="'+esc(value)+'"'+(value===String(current==null?"":current)?' selected':'')+'>'+esc(label)+'</option>';
    }).join("");
  }

  function statusClass(status){
    var map = {"Active":"status-active","Inactive":"status-inactive","Bypassed":"status-bypassed","Fault":"status-fault"};
    return map[status] || "status-inactive";
  }

  var toastTimer = null;
  function showToast(msg){
    var t = document.getElementById("toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ t.classList.remove("show"); }, 1800);
  }

  function daysSince(dateStr){
    if(!dateStr) return null;
    var d = new Date(dateStr);
    if(isNaN(d.getTime())) return null;
    return Math.floor((Date.now() - d.getTime()) / 86400000);
  }

  // Uses the linked customer's service frequency when set, otherwise a flat default.
  function siteOverdueInfo(site){
    var cust = site.customerId ? findCustomer(site.customerId) : null;
    if(cust && cust.serviceFrequency === "On-demand"){
      return {overdue:false, threshold:null, days: daysSince(site.lastVisited)};
    }
    var threshold = (cust && SERVICE_FREQ_DAYS[cust.serviceFrequency]) || DEFAULT_OVERDUE_DAYS;
    var d = daysSince(site.lastVisited);
    return {overdue: (d === null || d > threshold), threshold: threshold, days: d};
  }

  // ---------- view switching ----------

  function setView(view){
    if(VIEWS.indexOf(view) === -1) return;
    state.view = view;
    document.body.classList.remove("view-detail");
    renderApp();
  }

  function openSite(id){
    state.view = "sites";
    state.selectedSiteId = id;
    renderApp();
  }
  function openCustomer(id){
    state.view = "customers";
    state.selectedCustomerId = id;
    renderApp();
  }

  function renderApp(){
    document.getElementById("view-sites").style.display = state.view === "sites" ? "flex" : "none";
    document.getElementById("view-sites").classList.toggle("split-active", state.view === "sites");
    document.getElementById("view-customers").style.display = state.view === "customers" ? "flex" : "none";
    document.getElementById("view-customers").classList.toggle("split-active", state.view === "customers");
    document.getElementById("view-dashboard").style.display = state.view === "dashboard" ? "block" : "none";
    document.getElementById("view-reports").style.display = state.view === "reports" ? "block" : "none";

    document.querySelectorAll(".navtab").forEach(function(btn){
      btn.classList.toggle("active", btn.dataset.view === state.view);
    });

    var isListView = (state.view === "sites" || state.view === "customers");
    document.getElementById("search").style.display = isListView ? "" : "none";
    document.getElementById("search").placeholder = state.view === "customers" ? "Search customers, TL, Acc…" : "Search sites, panel, address…";
    document.getElementById("btn-new-site").style.display = state.view === "sites" ? "" : "none";
    document.getElementById("btn-new-customer").style.display = state.view === "customers" ? "" : "none";

    if(state.view === "sites"){ renderList(); renderDetail(); }
    else if(state.view === "customers"){ renderCustomerList(); renderCustomerDetail(); }
    else if(state.view === "dashboard"){ renderDashboard(); }
    else if(state.view === "reports"){ renderReports(); }

    renderStatusline();
  }

  function renderStatusline(){
    var n = state.sites.length;
    var c = state.customers.length;
    document.getElementById("statusline").textContent =
      n + (n===1 ? " SITE" : " SITES") + " · " + c + (c===1 ? " CUSTOMER" : " CUSTOMERS") + " · " + state.customers.reduce(function(x,c){return x+branchesForCustomer(c.id).length;},0) + " BRANCHES · SAVED LOCALLY";
  }

  // ================= SITES =================

  function siteHasIssue(site){
    return site.zones.some(function(z){ return z.status === "Fault" || z.status === "Bypassed"; });
  }

  function filteredSites(){
    var q = state.searchQuery.trim().toLowerCase();
    var list = state.sites;
    if(state.siteFilter === "attention"){
      list = list.filter(siteHasIssue);
    } else if(state.siteFilter === "unlinked"){
      list = list.filter(function(s){ return !s.customerId; });
    }
    if(q){
      list = list.filter(function(s){
        var cust = s.customerId ? findCustomer(s.customerId) : null;
        var cname = cust ? cust.name + " " + cust.acc + " " + cust.tl : "";
        return [s.name, s.address, s.client, s.panelBrand, s.panelModel, s.ipModule, cname].join(" ").toLowerCase().indexOf(q) !== -1;
      });
    }
    list = list.slice();
    if(state.siteSort === "name"){
      list.sort(function(a,b){ return (a.name||"").localeCompare(b.name||""); });
    } else if(state.siteSort === "visited"){
      list.sort(function(a,b){ return (a.lastVisited||"9999-99-99").localeCompare(b.lastVisited||"9999-99-99"); });
    } else if(state.siteSort === "zones"){
      list.sort(function(a,b){ return b.zones.length - a.zones.length; });
    } else if(state.siteSort === "attention"){
      list.sort(function(a,b){ return (siteHasIssue(b)?1:0) - (siteHasIssue(a)?1:0); });
    }
    return list;
  }

  function renderList(){
    var list = document.getElementById("sitelist");
    var sites = filteredSites();
    var filterRow =
      '<div class="filter-row">'+
        '<button class="filter-chip'+(state.siteFilter==="all"?" active":"")+'" data-action="set-site-filter" data-filter="all">All</button>'+
        '<button class="filter-chip'+(state.siteFilter==="attention"?" danger-active":"")+'" data-action="set-site-filter" data-filter="attention">Needs attention</button>'+
        '<button class="filter-chip'+(state.siteFilter==="unlinked"?" active":"")+'" data-action="set-site-filter" data-filter="unlinked">No customer</button>'+
      '</div>'+
      '<div class="list-toolbar">'+
        '<select class="sort-select" id="site-sort-select">'+
          '<option value="name"'+(state.siteSort==="name"?' selected':'')+'>Sort: Name</option>'+
          '<option value="visited"'+(state.siteSort==="visited"?' selected':'')+'>Sort: Last visited</option>'+
          '<option value="zones"'+(state.siteSort==="zones"?' selected':'')+'>Sort: Zone count</option>'+
          '<option value="attention"'+(state.siteSort==="attention"?' selected':'')+'>Sort: Needs attention first</option>'+
        '</select>'+
      '</div>';

    if(state.sites.length === 0){
      list.innerHTML = filterRow + '<div id="empty-list-msg">No sites yet. Tap "+ New site" to log your first one.</div>';
      return;
    }
    if(sites.length === 0){
      list.innerHTML = filterRow + '<div id="empty-list-msg">No sites match the current search or filter.</div>';
      return;
    }
    var html = sites.map(function(s){
      var zoneCount = s.zones.length;
      var panelLabel = [s.panelBrand, s.panelModel].filter(Boolean).join(" ") || "Panel not set";
      var cust = s.customerId ? findCustomer(s.customerId) : null;
      var issue = siteHasIssue(s);
      var overdue = siteOverdueInfo(s).overdue;
      return '<button class="site-item'+(s.id===state.selectedSiteId?' selected':'')+'" data-action="select-site" data-id="'+s.id+'">'+
        '<span class="sname">'+esc(s.name || "Untitled site")+(issue?' ⚠':'')+(overdue?' <span class="overdue-flag">⏰</span>':'')+'</span>'+
        '<span class="smeta">'+esc(panelLabel)+' · '+zoneCount+' zone'+(zoneCount===1?'':'s')+(cust?' · '+esc(cust.name)+' · '+esc(branchName(s)):' · No customer')+'</span>'+
        (s.address ? '<span class="saddr">'+esc(s.address)+'</span>' : '') +
        '</button>';
    }).join("");
    list.innerHTML = filterRow + html;
  }

  function renderDetail(){
    var detail = document.getElementById("detail");
    var site = findSite(state.selectedSiteId);
    document.body.classList.toggle("view-detail", !!site);

    if(!site){
      detail.innerHTML = '<div id="empty-state"><h2>No site selected</h2><p>Pick a site from the list, or add a new one, to record its panel, customer link, expanders, keypads, zones and visit history.</p></div>';
      return;
    }

    var cust = site.customerId ? findCustomer(site.customerId) : null;
    var branch = cust && site.branchId ? findBranch(cust.id, site.branchId) : null;
    var panelLine = [site.panelType, [site.panelBrand, site.panelModel].filter(Boolean).join(" ")].filter(Boolean).join(" · ") || "Not configured";
    var issueCount = site.zones.filter(function(z){ return z.status === "Fault" || z.status === "Bypassed"; }).length;
    var statusLabel = issueCount ? issueCount + ' attention item'+(issueCount===1?'':'s') : 'System record healthy';

    detail.innerHTML =
      '<div class="site-detail-head">'+
        '<button class="backbtn ghost" data-action="back">&larr; Sites workspace</button>'+
        '<div class="site-identity">'+
          '<div class="site-identity-icon">⌂</div>'+
          '<div class="site-identity-copy"><span class="eyebrow">SITE RECORD</span><h1 class="site-title">'+esc(site.name || "Untitled site")+'</h1><div class="site-sub">'+esc(branch ? branch.name : (cust ? cust.name : "Customer not linked"))+' · '+esc(site.address || "Address not configured")+'</div></div>'+
          '<div class="site-health '+(issueCount?'attention':'ok')+'"><span class="health-dot"></span>'+esc(statusLabel)+'</div>'+
        '</div>'+ 
        '<div class="site-quick-stats">'+
          '<div><span>Customer</span><strong>'+esc(cust ? cust.name : "Not linked")+'</strong></div>'+ 
          '<div><span>Alarm panel</span><strong>'+esc(panelLine)+'</strong></div>'+ 
          '<div><span>Zones</span><strong>'+site.zones.length+'</strong></div>'+ 
          '<div><span>Last service</span><strong>'+esc(site.lastVisited || "Not recorded")+'</strong></div>'+ 
        '</div>'+ 
        '<div class="site-head-actions"><button class="primary" data-action="edit-site" data-id="'+esc(site.id)+'">Edit site details</button><button class="ghost" data-action="print-report" data-id="'+esc(site.id)+'">Print report</button></div>'+ 
      '</div>'+
      '<div class="record-summary site-overview-grid">'+
        '<div class="rs-row"><span class="rs-k">Customer</span><span class="rs-v">'+esc(cust ? cust.name : "—")+'</span></div>'+

  function renderModalField(f){
    var cls = "field" + (f.span2 ? " span2" : "");
    var reqMark = f.required ? ' <span class="req">*</span>' : '';
    var inner;
    if(f.type === "select"){
      var blank = '<option value="">'+esc(f.placeholder || "—")+'</option>';
      inner = '<select data-mfield="'+f.key+'">'+blank+optionList(f.options || [], f.value)+'</select>';
    } else if(f.type === "textarea"){
      inner = '<textarea data-mfield="'+f.key+'" rows="3" placeholder="'+esc(f.placeholder || "")+'">'+esc(f.value)+'</textarea>';
    } else {
      inner = '<input type="'+(f.type || "text")+'" data-mfield="'+f.key+'" value="'+esc(f.value)+'" placeholder="'+esc(f.placeholder || "")+'">';
    }
    return '<div class="'+cls+'" data-mkey="'+f.key+'"><label>'+esc(f.label)+reqMark+'</label>'+inner+'<div class="field-error"></div></div>';
  }

  function openFormModal(opts){
    var overlay = document.createElement("div");
    overlay.className = "modal-overlay";
    var fieldsHtml = opts.fields.map(renderModalField).join("");
    overlay.innerHTML =
      '<div class="modal form-modal">'+
        '<h3>'+esc(opts.title)+'</h3>'+
        (opts.subtitle ? '<p>'+esc(opts.subtitle)+'</p>' : '')+
        '<div class="field-grid">'+fieldsHtml+'</div>'+
        '<div class="modal-actions">'+
          '<button class="ghost" type="button" data-close="1">Cancel</button>'+
          '<button class="primary" type="button" data-save="1">'+esc(opts.saveLabel || "Save")+'</button>'+
        '</div>'+
      '</div>';
    document.body.appendChild(overlay);
    var modalEl = overlay.querySelector(".modal");

    if(typeof opts.onCascade === "function") opts.onCascade(modalEl);

    function collectValues(){
      var values = {};
      modalEl.querySelectorAll("[data-mfield]").forEach(function(el){ values[el.dataset.mfield] = el.value; });
      return values;
    }
    function clearErrors(){
      modalEl.querySelectorAll(".field.invalid").forEach(function(f){ f.classList.remove("invalid"); });
      modalEl.querySelectorAll(".field-error").forEach(function(el){ el.textContent = ""; });
    }
    function showErrors(errors){
      clearErrors();
      var firstBad = null;
      Object.keys(errors).forEach(function(key){
        var wrap = modalEl.querySelector('[data-mkey="'+key+'"]');
        if(wrap){
          wrap.classList.add("invalid");
          var errEl = wrap.querySelector(".field-error");
          if(errEl) errEl.textContent = errors[key];
          if(!firstBad) firstBad = wrap.querySelector("[data-mfield]");
        }
      });
      if(firstBad) firstBad.focus();
    }
    function doSave(){
      var values = collectValues();
      var errors = (typeof opts.validate === "function") ? (opts.validate(values) || {}) : {};
      if(Object.keys(errors).length){ showErrors(errors); return; }
      overlay.remove();
      opts.onSave(values);
    }
    function doClose(){
      overlay.remove();
      if(typeof opts.onCancel === "function") opts.onCancel();
    }

    overlay.addEventListener("click", function(e){
      if(e.target === overlay || e.target.dataset.close){ doClose(); return; }
      if(e.target.dataset.save){ doSave(); }
    });
    overlay.addEventListener("keydown", function(e){
      if(e.key === "Escape"){ e.stopPropagation(); doClose(); }
      else if(e.key === "Enter" && e.target.tagName !== "TEXTAREA"){ e.preventDefault(); doSave(); }
    });

    var firstInput = modalEl.querySelector("[data-mfield]");
    if(firstInput){ setTimeout(function(){ firstInput.focus(); if(firstInput.select) firstInput.select(); }, 0); }
  }

    var dupeNumbers = {};
    zones.forEach(function(z){
      var n = String(z.number);
      if(seenNumbers[n]) dupeNumbers[n] = true;
      seenNumbers[n] = true;

    var rows = zones.map(function(z){
      var isDupe = dupeNumbers[String(z.number)];
      return '<tr data-row-id="'+z.id+'">'+

  function filteredCustomers(){
    var q = state.searchQuery.trim().toLowerCase();
    var list = state.customers;
    if(q){
      list = list.filter(function(c){
        var contactBits = c.contacts.map(function(x){ return x.name+" "+x.phone+" "+x.email; }).join(" ");
        var branchBits = branchesForCustomer(c.id).map(function(b){return [b.name,b.code,b.tl,b.acc,b.address,b.area,b.city,b.contact,b.phone,b.status].join(" ");}).join(" ");
        return [c.name, c.tl, c.acc, c.notes, contactBits, branchBits].join(" ").toLowerCase().indexOf(q) !== -1;
      });
    }
    list = list.slice();
    if(state.customerSort === "sites"){
      list.sort(function(a,b){ return sitesForCustomer(b.id).length - sitesForCustomer(a.id).length; });
    } else {
      list.sort(function(a,b){ return (a.name||"").localeCompare(b.name||""); });
    }
    return list;
  }

  function renderCustomerList(){
    var list = document.getElementById("customerlist");
    var customers = filteredCustomers();
    if(state.customers.length === 0){
      list.innerHTML = '<div id="empty-list-msg">No customers yet. Tap "+ New customer" or link one from a site.</div>';
      return;
    }
    if(customers.length === 0){
      list.innerHTML = '<div id="empty-list-msg">No customers match "'+esc(state.searchQuery)+'".</div>';
      return;

    var toolbar =
      '<div class="list-toolbar" style="padding-top:10px;">'+
        '<select class="sort-select" id="customer-sort-select">'+

          '<option value="sites"'+(state.customerSort==="sites"?' selected':'')+'>Sort: Most sites</option>'+
        '</select>'+
      '</div>';

      var siteCount = sitesForCustomer(c.id).length;

  function selectCustomer(id){

    renderCustomerList();

  function addCustomer(){
    openCustomerForm(null);

  function deleteCustomer(id){
    var cust = findCustomer(id);
    if(!cust) return;
    var linked = sitesForCustomer(id);
    confirmModal(
      "Delete " + (cust.name || "this customer") + "?",
      linked.length
        ? "This removes the customer record and unlinks it from " + linked.length + " site" + (linked.length===1?"":"s") + ". Sites themselves are kept. This can't be undone."
        : "This removes the customer record. This can't be undone.",
      "Delete",
      function(){
        state.sites.forEach(function(s){ if(s.customerId === id) s.customerId = ""; });
        state.customers = state.customers.filter(function(c){ return c.id !== id; });
        if(state.selectedCustomerId === id) state.selectedCustomerId = null;
        saveData();
        renderCustomerList();
        renderCustomerDetail();
        showToast("Customer deleted");
      }
    );
  }

  function addSiteForBranch(customerId,branchId){var c=findCustomer(customerId),b=findBranch(customerId,branchId);if(!c||!b)return;var site=newSite();site.name=b.name||"New site";site.customerId=c.id;site.branchId=b.id;site.address=b.address||"";site.__newRecord=true;openSiteForm(site);}

  // ================= DASHBOARD =================

  function renderDashboard(){
    var el = document.getElementById("view-dashboard");
    var totalSites = state.sites.length;
    var totalCustomers = state.customers.length;
    var totalZones = state.sites.reduce(function(sum,s){ return sum + s.zones.length; }, 0);

    var issueSites = state.sites.filter(siteHasIssue);
    var issueZoneCount = state.sites.reduce(function(sum,s){
      return sum + s.zones.filter(function(z){ return z.status === "Fault" || z.status === "Bypassed"; }).length;
    }, 0);

    var overdueSites = state.sites.filter(function(s){ return siteOverdueInfo(s).overdue; });

    var html = '<h1 class="site-title">Dashboard</h1><div class="site-sub">Overview across all sites and customers</div>';

    html += '<div class="stat-grid">'+
      '<div class="stat-card"><div class="num">'+totalSites+'</div><div class="label">Sites</div></div>'+
      '<div class="stat-card"><div class="num">'+totalCustomers+'</div><div class="label">Customers</div></div>'+
      '<div class="stat-card"><div class="num">'+totalZones+'</div><div class="label">Zones logged</div></div>'+
      '<div class="stat-card'+(issueZoneCount?' danger':'')+'"><div class="num">'+issueZoneCount+'</div><div class="label">Zones in fault / bypassed</div></div>'+
      '<div class="stat-card'+(overdueSites.length?' warn':'')+'"><div class="num">'+overdueSites.length+'</div><div class="label">Sites overdue a visit</div></div>'+
      '</div>';

    html += renderDashboardCharts();

    html += '<div class="dash-section"><h2>Needs attention ('+issueSites.length+')</h2>';
    html += issueSites.length ?
      '<div class="dash-list">'+issueSites.map(function(s){
        var badCount = s.zones.filter(function(z){ return z.status==="Fault"||z.status==="Bypassed"; }).length;
        return '<button class="link-row" data-action="open-site" data-id="'+s.id+'">'+
          '<span class="lr-title">'+esc(s.name || "Untitled site")+'</span>'+
          '<span class="lr-sub">'+badCount+' zone'+(badCount===1?'':'s')+' need'+(badCount===1?'s':'')+' review</span>'+
          '</button>';
      }).join("")+'</div>'
      : '<div class="empty-rows">No faults or bypassed zones right now.</div>';
    html += '</div>';

    html += '<div class="dash-section"><h2>Overdue for a visit ('+overdueSites.length+')</h2>';
    html += overdueSites.length ?
      '<div class="dash-list">'+overdueSites.slice(0,20).map(function(s){
        var info = siteOverdueInfo(s);
        var sub = info.days===null ? "Never visited" : info.days+" days since last visit (due every "+info.threshold+"d)";
        return '<button class="link-row" data-action="open-site" data-id="'+s.id+'">'+
          '<span class="lr-title">'+esc(s.name || "Untitled site")+'</span>'+
          '<span class="lr-sub">'+esc(sub)+'</span>'+
          '</button>';
      }).join("")+'</div>'
      : '<div class="empty-rows">Every site is within its service schedule.</div>';
    html += '</div>';

    el.innerHTML = html;
  }

  function renderDashboardCharts(){
    var statusCounts = {Active:0, Inactive:0, Bypassed:0, Fault:0};
    var brandCounts = {};
    var totalZones = 0;
    state.sites.forEach(function(s){
      s.zones.forEach(function(z){
        totalZones++;
        if(statusCounts.hasOwnProperty(z.status)) statusCounts[z.status]++;
      });
      if(s.panelBrand) brandCounts[s.panelBrand] = (brandCounts[s.panelBrand]||0) + 1;
    });

    function bar(label, count, total, color){
      var pct = total ? Math.round(count/total*100) : 0;
      return '<div class="bar-row"><span class="bar-label">'+esc(label)+'</span>'+
        '<div class="bar-track"><div class="bar-fill" style="width:'+pct+'%; background:'+color+';"></div></div>'+
        '<span class="bar-count">'+count+'</span></div>';
    }

    var html = '<div class="dash-section"><h2>Zone status breakdown</h2>';
    var zTotal = totalZones || 1;
    html += bar("Active", statusCounts.Active, zTotal, "var(--accent)");
    html += bar("Bypassed", statusCounts.Bypassed, zTotal, "var(--warn)");
    html += bar("Fault", statusCounts.Fault, zTotal, "var(--danger)");
    html += bar("Inactive", statusCounts.Inactive, zTotal, "var(--text-faint)");
    html += '</div>';

    var brandKeys = Object.keys(brandCounts);
    if(brandKeys.length){
      html += '<div class="dash-section"><h2>Panel brand distribution</h2>';
      var bTotal = state.sites.length || 1;
      brandKeys.sort(function(a,b){ return brandCounts[b]-brandCounts[a]; }).forEach(function(k){
        html += bar(k, brandCounts[k], bTotal, "var(--focus)");
      });
      html += '</div>';
    }
    return html;
  }

  function attentionRows(){
    var q = state.reportSearch.trim().toLowerCase();
    var rows = [];
    state.sites.forEach(function(s){
      s.zones.forEach(function(z){
        var isIssue = state.attentionFilter === "all" ? (z.status === "Fault" || z.status === "Bypassed") : z.status === state.attentionFilter;
        if(!isIssue) return;
        if(q){
          var hay = [s.name, z.description, z.deviceType, z.number, z.notes].join(" ").toLowerCase();
          if(hay.indexOf(q) === -1) return;
        }
        rows.push({site: s, zone: z});
      });
    });
    if(state.attentionSort === "site"){
      rows.sort(function(a,b){ return a.site.name.localeCompare(b.site.name) || (Number(a.zone.number)||0)-(Number(b.zone.number)||0); });
    } else if(state.attentionSort === "zone"){
      rows.sort(function(a,b){ return (Number(a.zone.number)||0)-(Number(b.zone.number)||0); });
    } else {
      rows.sort(function(a,b){
        if(a.zone.status !== b.zone.status) return a.zone.status === "Fault" ? -1 : 1;
        return a.site.name.localeCompare(b.site.name);
      });
    }
    return rows;
  }

    return '<div class="report-controls">'+
      '<input type="search" class="report-search" id="report-search" placeholder="Search site, zone, device…" value="'+esc(state.reportSearch)+'">'+
      '<div class="filter-row" style="padding:0; border:0;">'+
        reportChip("All issues", "set-attention-filter", "all", state.attentionFilter) +
        reportChip("Fault", "set-attention-filter", "Fault", state.attentionFilter) +
        reportChip("Bypassed", "set-attention-filter", "Bypassed", state.attentionFilter) +
      '</div>'+
      '<select class="sort-select" id="attention-sort-select" style="margin-left:auto;">'+
        '<option value="severity"'+(state.attentionSort==="severity"?' selected':'')+'>Sort: Fault first</option>'+
        '<option value="site"'+(state.attentionSort==="site"?' selected':'')+'>Sort: Site name</option>'+
        '<option value="zone"'+(state.attentionSort==="zone"?' selected':'')+'>Sort: Zone number</option>'+
      '</select>'+
      '</div>';

  function renderAttentionBody(){
    var rows = attentionRows();

    if(rows.length === 0){
      inner = '<div class="report-empty">No matching zones right now.</div>';
    } else {
      var body = rows.map(function(r){
        return '<tr>'+
          '<td>'+esc(r.site.name)+'</td>'+
          '<td>'+esc(r.zone.number)+'</td>'+
          '<td>'+esc(r.zone.description)+'</td>'+
          '<td>'+esc(r.zone.deviceType)+'</td>'+

          '<td><button class="ghost icon" data-action="open-site" data-id="'+r.site.id+'">Open</button></td>'+
          '</tr>';

    }
    return '<div class="report-tab-body"><span class="report-count">'+rows.length+' result'+(rows.length===1?'':'s')+'</span>'+inner+'</div>';

  function renderAttentionReport(){
    return renderAttentionControls() + renderAttentionBody();
  }

  function visitRows(){
    var q = state.reportSearch.trim().toLowerCase();
    var cutoffDays = {"30":30, "90":90, "365":365}[state.visitsFilter];
    var rows = [];
    state.sites.forEach(function(s){
      s.visits.forEach(function(v){
        if(cutoffDays !== undefined){
          var d = daysSince(v.date);
          if(d === null || d > cutoffDays) return;
        }
        if(q){
          var hay = [s.name, v.technician, v.notes, v.date].join(" ").toLowerCase();
          if(hay.indexOf(q) === -1) return;
        }
        rows.push({site: s, visit: v});
      });
    });
    if(state.visitsSort === "date-asc"){
      rows.sort(function(a,b){ return (a.visit.date||"").localeCompare(b.visit.date||""); });
    } else if(state.visitsSort === "site"){

  // ---------- CSV export ----------

  function csvEscape(v){
    v = String(v==null ? "" : v);
    if(/[",\n]/.test(v)) v = '"'+v.replace(/"/g,'""')+'"';
    return v;
  }
  function downloadCSV(filename, rows){
    var csv = rows.map(function(r){ return r.map(csvEscape).join(","); }).join("\r\n");
    var blob = new Blob([csv], {type:"text/csv"});
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
  }

  function normKey(s){ return String(s||"").trim().toLowerCase(); }

  function mergeSubList(targetSite, incSite, listKey, keyFn){
    if(!Array.isArray(incSite[listKey])) return;
    if(!Array.isArray(targetSite[listKey])) targetSite[listKey] = [];
    var existingKeys = {};
    targetSite[listKey].forEach(function(x){ existingKeys[keyFn(x)] = true; });
    incSite[listKey].forEach(function(x){
      var k = keyFn(x);
      if(!existingKeys[k]){
        var copy = {};
        Object.keys(x).forEach(function(p){ copy[p] = x[p]; });
        copy.id = uid();
        targetSite[listKey].push(copy);
        existingKeys[k] = true;
      }
    });
  }

  // Merge import: customers are matched by Acc or TL, sites by name + address.
  // A match updates the existing record in place (and appends any new sub-rows);
  // no match creates a fresh record. This is what stops duplicates piling up
  // when the same fleet gets re-exported and re-imported later.
  function smartMergeImport(incomingSites, incomingCustomers){
    var stats = {customersAdded:0, customersUpdated:0, sitesAdded:0, sitesUpdated:0};
    var idMap = {};

    incomingCustomers.forEach(function(inc){
      var incAcc = normKey(inc.acc);
      var incTl = normKey(inc.tl);
      var matched = null;
      if(incAcc || incTl){
        matched = state.customers.filter(function(c){
          return (incAcc && normKey(c.acc) === incAcc) || (incTl && normKey(c.tl) === incTl);
        })[0] || null;
      }
      if(matched){
        ["name","tl","acc","notes","contractType","contractStart","contractRenewal","serviceFrequency"].forEach(function(k){
          if(inc[k]) matched[k] = inc[k];
        });
        if(Array.isArray(inc.contacts)){
          inc.contacts.forEach(function(p){
            var exists = matched.contacts.some(function(mp){
              return normKey(mp.name) === normKey(p.name) && normKey(mp.phone) === normKey(p.phone);
            });
            if(!exists) matched.contacts.push({id: uid(), name:p.name||"", role:p.role||"", phone:p.phone||"", email:p.email||""});
          });
        }
        if(inc.id) idMap[inc.id] = matched.id;
        stats.customersUpdated++;
      } else {
        var nc = newCustomer();
        ["name","tl","acc","notes","contractType","contractStart","contractRenewal","serviceFrequency"].forEach(function(k){
          nc[k] = inc[k] || "";
        });
        nc.contacts = Array.isArray(inc.contacts) ? inc.contacts.map(function(p){
          return {id: uid(), name:p.name||"", role:p.role||"", phone:p.phone||"", email:p.email||""};
        }) : [];
        state.customers.push(nc);
        if(inc.id) idMap[inc.id] = nc.id;
        stats.customersAdded++;
      }
    });

    incomingSites.forEach(function(inc){
      var incName = normKey(inc.name);
      var incAddr = normKey(inc.address);
      var matched = incName ? (state.sites.filter(function(s){
        return normKey(s.name) === incName && (!incAddr || normKey(s.address) === incAddr);
      })[0] || null) : null;
      var resolvedCustomerId = (inc.customerId && idMap[inc.customerId]) ? idMap[inc.customerId] : (matched ? matched.customerId : "");

      if(matched){
        ["name","address","client","panelBrand","panelModel","ipModule","panelType","lastVisited","notes"].forEach(function(k){
          if(inc[k]) matched[k] = inc[k];
        });
        if(resolvedCustomerId) matched.customerId = resolvedCustomerId;
        mergeSubList(matched, inc, "expanders", function(x){ return normKey(x.model)+"|"+normKey(x.location); });
        mergeSubList(matched, inc, "keypads", function(x){ return normKey(x.model)+"|"+normKey(x.location); });
        mergeSubList(matched, inc, "zones", function(x){ return normKey(x.number); });
        mergeSubList(matched, inc, "visits", function(x){ return normKey(x.date)+"|"+normKey(x.technician); });
        stats.sitesUpdated++;
      } else {
        var ns = newSite();
        ["name","address","client","panelBrand","panelModel","ipModule","panelType","lastVisited","notes"].forEach(function(k){
          if(inc[k]) ns[k] = inc[k];
        });
        ns.customerId = resolvedCustomerId || "";
        ["expanders","keypads","zones","visits"].forEach(function(listKey){
          ns[listKey] = Array.isArray(inc[listKey]) ? inc[listKey].map(function(x){
            var copy = {};
            Object.keys(x).forEach(function(p){ copy[p] = x[p]; });
            copy.id = uid();
            return copy;
          }) : [];
        });
        state.sites.push(ns);
        stats.sitesAdded++;
      }
    });

    return stats;
  }

  function importDataFile(file){
    var reader = new FileReader();
    reader.onload = function(){
      var parsed;
      try{ parsed = JSON.parse(reader.result); }
      catch(e){ showToast("That file isn't valid JSON"); return; }
      if(!parsed || !Array.isArray(parsed.sites)){ showToast("No site data found in that file"); return; }
      var incomingSites = parsed.sites;
      var incomingCustomers = Array.isArray(parsed.customers) ? parsed.customers : [];

      importChoiceModal(incomingSites.length, function(mode){
        var summary;
        if(mode === "replace"){
          state.sites = incomingSites;
          state.customers = incomingCustomers;
          summary = "Replaced with " + incomingSites.length + " site" + (incomingSites.length===1?"":"s");
        } else if(mode === "merge"){
          var stats = smartMergeImport(incomingSites, incomingCustomers);
          var parts = [];
          if(stats.sitesAdded) parts.push(stats.sitesAdded + " site" + (stats.sitesAdded===1?"":"s") + " added");
          if(stats.sitesUpdated) parts.push(stats.sitesUpdated + " updated");
          if(stats.customersAdded) parts.push(stats.customersAdded + " customer" + (stats.customersAdded===1?"":"s") + " added");
          if(stats.customersUpdated) parts.push(stats.customersUpdated + " updated");
          summary = parts.length ? parts.join(", ") : "Nothing new to import — everything already matched";
        } else {
          return;
        }

        state.sites.forEach(function(s){
          if(!Array.isArray(s.expanders)) s.expanders = [];
          if(!Array.isArray(s.keypads)) s.keypads = [];
          if(!Array.isArray(s.zones)) s.zones = [];
          if(!Array.isArray(s.visits)) s.visits = [];
          if(typeof s.customerId !== "string") s.customerId = "";
        });
        state.customers.forEach(function(c){
          if(!Array.isArray(c.contacts)) c.contacts = [];
          if(typeof c.notes !== "string") c.notes = "";
          if(typeof c.contractType !== "string") c.contractType = "";
          if(typeof c.contractStart !== "string") c.contractStart = "";
          if(typeof c.contractRenewal !== "string") c.contractRenewal = "";
          if(typeof c.serviceFrequency !== "string") c.serviceFrequency = "";
        });
        state.selectedSiteId = null;
        state.selectedCustomerId = null;
        saveData();
        renderApp();
        showToast(summary);
      });
    };
    reader.onerror = function(){ showToast("Couldn't read that file"); };
    reader.readAsText(file);
  }

  function importChoiceModal(count, callback){
    var overlay = document.createElement("div");
    overlay.className = "modal-overlay";
    overlay.innerHTML =
      '<div class="modal">'+
        '<h3>Import '+count+' site'+(count===1?"":"s")+'</h3>'+
        '<p>Merge matches customers by Acc or TL and sites by name + address, updating existing records instead of duplicating them — anything new is added. Replace clears your current data first.</p>'+
        '<div class="modal-actions">'+
          '<button class="ghost" data-close="1">Cancel</button>'+
          '<button data-mode="replace">Replace all</button>'+
          '<button class="primary" data-mode="merge">Merge</button>'+
        '</div>'+
      '</div>';
    document.body.appendChild(overlay);
    overlay.addEventListener("click", function(e){
      if(e.target === overlay || e.target.dataset.close){ overlay.remove(); callback("cancel"); return; }
      if(e.target.dataset.mode){ overlay.remove(); callback(e.target.dataset.mode); }

  // ---------- event delegation ----------

  document.body.addEventListener("click", function(e){
    var t = e.target.closest("[data-action]");
    if(!t) return;
    var action = t.dataset.action;

    if(action === "set-view"){ setView(t.dataset.view); return; }
    if(action === "select-site"){ selectSite(t.dataset.id); return; }
    if(action === "select-customer"){ selectCustomer(t.dataset.id); return; }
    if(action === "open-site"){ openSite(t.dataset.id); return; }
    if(action === "open-customer"){ openCustomer(t.dataset.id); return; }
    if(action === "back"){
      if(state.view === "customers") state.selectedCustomerId = null;
      else state.selectedSiteId = null;
      document.body.classList.remove("view-detail");
      renderApp();
      return;
    }
    if(action === "delete-site"){ deleteSite(t.dataset.id); return; }
    if(action === "delete-customer"){ deleteCustomer(t.dataset.id); return; }
    if(action === "edit-site"){ var esite = findSite(t.dataset.id); if(esite) openSiteForm(esite); return; }
    if(action === "edit-customer"){ var ecust = findCustomer(t.dataset.id); if(ecust) openCustomerForm(ecust); return; }
    if(action === "add-branch"){ addBranch(t.dataset.customerId); return; }
    if(action === "edit-branch"){ var bc=findCustomer(t.dataset.customerId); var bb=bc&&findBranch(bc.id,t.dataset.id); if(bc&&bb) openBranchForm(bc,bb); return; }
    if(action === "delete-branch"){ deleteBranch(t.dataset.customerId,t.dataset.id); return; }
    if(action === "new-site-for-branch"){ addSiteForBranch(t.dataset.customerId,t.dataset.id); return; }
    if(action === "set-site-filter"){ state.siteFilter = t.dataset.filter; renderList(); return; }
    if(action === "set-report-tab"){ state.reportTab = t.dataset.tab; renderReports(); return; }
    if(action === "set-attention-filter"){ state.attentionFilter = t.dataset.value; renderReports(); return; }
    if(action === "set-visits-filter"){ state.visitsFilter = t.dataset.value; renderReports(); return; }
    if(action === "pick-report-site"){ state.reportSiteId = t.dataset.id; renderReports(); return; }
    if(action === "export-zones-csv"){ exportZonesCSV(); return; }
    if(action === "export-visits-csv"){ exportVisitsCSV(); return; }
    if(action === "export-customers-csv"){ exportCustomersCSV(); return; }
    if(action === "print-report"){ var ps = findSite(t.dataset.id); if(ps) printSiteReport(ps); return; }
    if(action === "quick-add-customer"){ var qs = findSite(t.dataset.id); if(qs) quickAddCustomerToSite(qs); return; }

    if(action === "add-contact" || action === "remove-contact"){
      var cust = findCustomer(state.selectedCustomerId);
      if(!cust) return;
      if(action === "add-contact") addContact(cust);
      else removeContact(cust, t.dataset.id);
      return;
    }

    var site = findSite(state.selectedSiteId);
    if(!site) return;
    if(action === "add-expander") addExpander(site);
    else if(action === "remove-expander") removeExpander(site, t.dataset.id);
    else if(action === "duplicate-expander") duplicateExpander(site, t.dataset.id);
    else if(action === "add-keypad") addKeypad(site);
    else if(action === "remove-keypad") removeKeypad(site, t.dataset.id);
    else if(action === "duplicate-keypad") duplicateKeypad(site, t.dataset.id);
    else if(action === "add-zone") addZone(site);

    if(state.view==="dashboard") renderEnhancedDashboard();
  };

  document.body.addEventListener("click",function(e){
    var t=e.target.closest("[data-action]");if(!t)return;var a=t.dataset.action,type=t.dataset.type,id=t.dataset.id;
    if(a==="ops-add"){addEntity(type);return;}
    if(a==="ops-edit"){editEntity(type,id);return;}
    if(a==="ops-archive"){archiveEntity(type,id);return;}
    if(a==="ops-restore"){restoreEntity(type,id);return;}
    if(a==="ops-show-archived"){
      var sf=document.getElementById("ops-status-filter");
      if(sf){ sf.value="archived"; sf.dispatchEvent(new Event("change")); }
      return;
    }
  });

  // ---------- Professional UI layer ----------
  function applyTheme(theme){
    document.body.classList.toggle("theme-light", theme === "light");
    try{ localStorage.setItem("panelLog.theme", theme); }catch(e){}
    var b=document.getElementById("btn-theme");
    if(b){
      b.textContent = theme === "light" ? "☾" : "☀";
      b.title = theme === "light" ? "Switch to dark theme" : "Switch to light theme";
      b.setAttribute("aria-label", b.title);
    }
  }
  function initTheme(){
    var theme="dark";
    try{ theme=localStorage.getItem("panelLog.theme")||"dark"; }catch(e){}
    applyTheme(theme);
    var b=document.getElementById("btn-theme");
    if(b) b.addEventListener("click",function(){
      applyTheme(document.body.classList.contains("theme-light")?"dark":"light");
      showToast(document.body.classList.contains("theme-light")?"Light theme enabled":"Dark theme enabled");
    });
  }
  initTheme();

  // ---------- cloud/PWA boot ----------
  await window.PanelCloud.boot();
  // Pull the authenticated user's cloud snapshot into the local cache before
  // the original application state is loaded. If the cloud is empty, the
  // existing local data is migrated upward instead.
  await window.PanelCloud.migrateLocalIfNeeded();
  loadExtra();
  // ---------- init ----------
  loadData();
  renderApp();
  window.PanelCloud.startAutoSync();
  if("serviceWorker" in navigator){ navigator.serviceWorker.register("sw.js").catch(function(err){ console.warn("PWA service worker registration failed", err); }); }
})();
</script>
</body>
</html>
